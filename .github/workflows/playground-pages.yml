name: Deploy Playground to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/playground-pages.yml'
      - 'examples/playground/**'
      - 'src/**'
      - 'test/browser/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsup.config.ts'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Playground
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Browser package tests
        run: npm run test:browser

      - name: Build Playground
        run: npm run playground:build
        env:
          ONEDICE_PLAYGROUND_BASE: './'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Playground artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/playground/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
